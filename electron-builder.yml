appId: com.mailhub.desktop
productName: MailHub
directories:
  output: release
files:
  - dist
  - dist-electron
publish:
  provider: github
  owner: autumnsj
  repo: mail-hub
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
